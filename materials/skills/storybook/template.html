<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책 제목</title>
<style>
  :root { --paper:#FFF9EF; --ink:#33281E; --edge:#D9C9A8; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         background:#B9AA8D; min-height:100vh; display:flex;
         align-items:center; justify-content:center; padding:4vmin; }
  .book { width:min(680px,94vw); background:var(--paper); color:var(--ink);
          border:1px solid var(--edge); border-radius:8px;
          box-shadow:0 10px 30px rgba(0,0,0,.25); padding:6vmin 7vmin; }
  .page { display:none; text-align:center; }
  .page.on { display:block; }
  .page img { max-width:100%; max-height:52vh; border-radius:6px; margin-bottom:3vmin; }
  .page h1 { font-size:6.5vmin; margin:4vmin 0; line-height:1.3; }
  .page p { font-size:3.4vmin; line-height:1.9; text-align:left; }
  .cover p { text-align:center; color:#8A7A60; }
  .turn { display:flex; justify-content:space-between; margin-top:5vmin; }
  .turn button { font:inherit; font-size:3vmin; padding:1.2vmin 3vmin;
                 border:1px solid var(--edge); background:#FFF; color:var(--ink);
                 border-radius:6px; cursor:pointer; }
  .turn button:disabled { opacity:.3; cursor:default; }
  .pageno { font-size:2.6vmin; color:#8A7A60; align-self:center; }
</style>
</head>
<body>
<div class="book">

<!-- ▼ 페이지 1장 = <section class="page"> 하나 ▼ -->

<section class="page cover">
  <h1>책 제목</h1>
  <p>글·그림 만든이 이름</p>
</section>

<section class="page">
  <img src="story/scene1.png" alt="장면 1 그림">
  <p>첫 번째 장면의 이야기를 여기에 씁니다.</p>
</section>

<section class="page">
  <img src="story/scene2.png" alt="장면 2 그림">
  <p>두 번째 장면.</p>
</section>

<section class="page cover">
  <h1>끝</h1>
  <p>읽어주셔서 고맙습니다</p>
</section>

<!-- ▲ 여기까지 페이지 ▲ -->

<div class="turn">
  <button id="prev">◀ 앞장</button>
  <span class="pageno" id="no"></span>
  <button id="next">다음 장 ▶</button>
</div>
</div>
<script>
// 책장 넘기기 — 수정하지 않아도 됩니다
const P=[...document.querySelectorAll('.page')]; let i=0;
const prev=document.getElementById('prev'), next=document.getElementById('next');
function go(n){ i=Math.max(0,Math.min(P.length-1,n));
  P.forEach((p,k)=>p.classList.toggle('on',k===i));
  document.getElementById('no').textContent=(i+1)+' / '+P.length;
  prev.disabled=(i===0); next.disabled=(i===P.length-1); }
prev.onclick=()=>go(i-1); next.onclick=()=>go(i+1);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight')go(i+1); if(e.key==='ArrowLeft')go(i-1); });
go(0);
</script>
</body>
</html>
